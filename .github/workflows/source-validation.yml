name: Source validation

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and repository tests
        run: pnpm test

      - name: Drift contract
        run: pnpm check:drift

      - name: FCM mock acceptance
        run: pnmp test:fcm:mock

      - name: Web build
        run: pnmp build:web
